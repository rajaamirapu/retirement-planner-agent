<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retirement Planner UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Retirement Planner</h1>
      <p>Enter your monthly income, loan details, and retirement goals.</p>

      <form id="planner-form" class="card grid">
        <label>Gross Salary
          <input type="number" name="salary" min="0" step="100" value="50000" required />
        </label>
        <label>Deductions
          <input type="number" name="deductions" min="0" step="100" value="5000" required />
        </label>
        <label>Loan Amount
          <input type="number" name="loanAmount" min="0" step="1000" value="200000" required />
        </label>
        <label>Loan Interest Rate (%)
          <input type="number" name="loanInterestRate" min="0" max="100" step="0.1" value="7.5" required />
        </label>
        <label>Loan Tenure (Months)
          <input type="number" name="loanTenureMonths" min="1" step="1" value="180" required />
        </label>
        <label>Current Savings
          <input type="number" name="currentSavings" min="0" step="1000" value="100000" required />
        </label>
        <label>Expected Monthly Expenses
          <input type="number" name="expectedExpenses" min="0" step="100" value="30000" required />
        </label>
        <label>Current Age
          <input type="number" name="currentAge" min="18" max="100" step="1" value="30" required />
        </label>
        <label>Retirement Age
          <input type="number" name="retirementAge" min="30" max="100" step="1" value="65" required />
        </label>

        <button type="submit">Generate Plan</button>
      </form>

      <section id="results" class="card hidden"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
